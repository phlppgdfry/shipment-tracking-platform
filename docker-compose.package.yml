# Local synthetic demonstration of the published image. SQL Server requires amd64.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in your local .env}
    volumes:
      - package-sql:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
  api:
    image: ${SHIPMENT_IMAGE:-ghcr.io/phlppgdfry/shipment-tracking-api:0.2.0}
    platform: linux/amd64
    ports:
      - "127.0.0.1:5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sql;Database=ShipmentPackageDemo;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD};TrustServerCertificate=true
      JwtSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET to at least 32 characters}
      Redis__ConnectionString: ""
      Demo__Seed: "true"
      Demo__DispatcherPassword: ${DEMO_DISPATCHER_PASSWORD:?Set DEMO_DISPATCHER_PASSWORD}
    depends_on:
      sql:
        condition: service_healthy
    volumes:
      - package-documents:/tmp/shipment-tracking/documents
volumes:
  package-sql:
  package-documents:
